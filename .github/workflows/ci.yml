name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read


jobs:
  vet:
    name: vet (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.23"
          - "1.24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('app/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Run go vet
        working-directory: app
        run: go vet ./...


  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.23"
          - "1.24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('app/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Run tests
        working-directory: app
        run: go test -race -count=1 ./...


  lint:
    name: lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: app
